{% if result %}<span class="badge {{result.verdict|lower}}">{{result.verdict|default:'Not evaluated yet'}}</span><p>Execution: {{result.run.status}}{% if result.run.error.code %}<br><strong>{{result.run.error.code}}</strong>{% endif %}</p><div class="run-id subtle-copy">{{result.run_id}}</div><p class="subtle-copy">{{result.run.created_at|date:'d M Y, H:i:s'}} IST</p><div class="run-links"><a href="/runs/{{result.run_id}}/report">Report</a><a href="/runs/{{result.run_id}}/trace">Trace</a></div>{% else %}<span class="subtle-copy">No saved result in this mode</span>{% endif %}
