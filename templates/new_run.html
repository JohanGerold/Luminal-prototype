{% extends 'base.html' %}{% block content %}
<h1>Run evaluation</h1>
<p>Starting a run resets the owned synthetic files in <code>C:\AAP-Demo-Workspace</code>. Google Gemini selects real filesystem tools through n8n.</p>
<form id="start">{% csrf_token %}
<p><label>Agent version <select name="agent_version">{% for version in versions %}<option value="{{version.version}}">{{version.version}}</option>{% endfor %}</select></label></p>
<p><label>Scenario <select name="scenario_id">{% for scenario in scenarios %}<option value="{{scenario.id}}">{{scenario.name}}</option>{% endfor %}</select></label></p>
<p><label>Execution mode <select name="execution_mode"><option value="LIVE_MODEL">LIVE_MODEL — real Google Gemini</option></select></label></p>
<button type="submit">Run evaluation</button> <button type="button" id="reset">Reset demo workspace</button>
</form><p id="message" role="status"></p>
<script>
const form=document.querySelector('#start'), message=document.querySelector('#message');
async function post(url,body){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':form.elements.csrfmiddlewaretoken.value},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw new Error(data.error);return data;}
form.addEventListener('submit',async event=>{event.preventDefault();form.querySelector('button').disabled=true;message.textContent='Starting LIVE_MODEL…';try{const data=await post('/api/runs',Object.fromEntries(['agent_version','scenario_id','execution_mode'].map(key=>[key,form.elements[key].value])));location.href=data.url;}catch(error){message.textContent=error.message;form.querySelector('button').disabled=false;}});
document.querySelector('#reset').addEventListener('click',async()=>{try{await post('/api/reset',{});message.textContent='Synthetic workspace reset.';}catch(error){message.textContent=error.message;}});
</script>{% endblock %}
