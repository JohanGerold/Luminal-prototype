[project]
name = "aap-prototype"
version = "0.1.0"
description = "Local AI agent evaluation demonstration"
requires-python = ">=3.13,<3.14"
dependencies = ["Django==5.2.17", "waitress==3.0.2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
